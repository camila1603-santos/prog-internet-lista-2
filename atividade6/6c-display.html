<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6a-display</title>
    <style>

        .container{
            border: solid 1px gray;
            width: 600px;
            height: 600px;
            position: relative;
        }

        .box{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 150px;
            width: 150px;
        }
        #box1{
            background-color: red;
            position: absolute;
            top: 0px;
            left: 0px;
        }
        #box2{
            background-color: yellow;
            position: absolute;
            top: 0px;
            right: 0px;
        }
        #box3{
            background-color: green;
            position: absolute;
            bottom: 0px;
            right: 0px;
        }
        #box4{
            background-color: blue;
            position: absolute;
            bottom: 0px;
            left: 0px;
        }
        #box5{
            background-color: magenta;
            position: absolute;
            top: 225px;
            left: 225px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
    </div>
</body>
</html>
