<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6a-display</title>
    <style>

        .container{
            border: solid 1px gray;
            width: 1800px;
            height: 800px;

        }

        .box{
            height: 150px;
            width: 150px;
        }
        #box1{
            background-color: blue;
            position: absolute;
            top: 0px;
            left: 0px;
        }
        #box2{
            background-color: green;
            position: absolute;
            top: 0px;
            right: 50px;
        }
        #box3{
            background-color: red;
            position: absolute;
            bottom: 100px;
            left: 0px;
        }
        #box4{
            background-color: yellow;
            position: absolute;
            bottom: 100px;
            right: 50px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
        <div class="box" id="box4">4</div>
    </div>
</body>
</html>
