<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        .container {
            border: solid 1px gray;
            height: 700px;
            width: 600px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .box {
            display: flex;
            align-items: center;
            justify-content: center;
            border: solid 1px gray;
            height: 100px;
            width: 500px;
            clear: both;
        }

        #box2,
        #box4 {
            background-color: rgb(207, 224, 209);
        }

        #mensagem {
            border: solid 1px gray;
            height: 100px;
            width: 500px;
        }

        .nome {
            float: inline-start;
        }

        .enviar {
            display: flex;
            justify-content: flex-end;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="msg">
            <span class="nome">Pedro Silva</span>
            <div class="box" id="box1">Olá, tudo bem?</div>
        </div>
        <div class="msg">
            <span class="nome">Eu</span>
            <div class="box" id="box2">Estou bem sim, e você?</div>
        </div>
        <div class="msg">
            <span class="nome">Pedro Silva</span>
            <div class="box" id="box3">Vamos sair hoje? Lorem, ipsum ...</div>
        </div>
        <div class="msg">
            <span class="nome">Eu</span>
            <div class="box" id="box4">Criatura...</div>
        </div>
        <div class="input">
            <label for="mensagem"></label>
            <input type="text" id="mensagem" placeholder="Digite aqui sua mensagem">
        </div>
        <div class="enviar">
            <button>Enviar</button>
        </div>
    </div>
</body>

</html>
